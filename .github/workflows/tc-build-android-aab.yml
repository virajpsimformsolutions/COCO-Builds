name: "[TC] Build Android AAB (Release)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g. develop, main, feat/xyz)'
        required: true
        default: 'develop'
      environment:
        description: 'Build environment'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    name: TC Build AAB (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout coco-mobile source ─────────────────────────────────────
      - name: Checkout coco-mobile
        uses: actions/checkout@v4
        with:
          repository: coco-staging/coco-mobile
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      # ── 2. Setup tools ─────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      # ── 3. Cache Gradle ────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/yarn.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      # ── 5. Write .env.<environment> file from secrets ──────────────────────
      # Patient app's yarn eas:local scripts source .env.<profile> explicitly
      # (eas build --local doesn't reliably pull EAS-hosted environment vars
      # on its own — expo/eas-cli#2195). TC's scripts don't wrap with the same
      # loader, so we source this file ourselves before invoking eas-cli below
      # to close that same gap here.
      - name: Write .env file
        working-directory: app
        env:
          ENV_API_URL: ${{ secrets.COCO_TC_API_URL }}
          ENV_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          ENV_SENTRY_URL: ${{ secrets.COCO_TC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ secrets.COCO_TC_SENTRY_DSN }}
          ENV_SENTRY_PROJECT: ${{ secrets.COCO_TC_SENTRY_PROJECT }}
          ENV_SENTRY_ORG: ${{ secrets.COCO_TC_SENTRY_ORG }}
          ENV_SENTRY_TOKEN: ${{ secrets.COCO_TC_SENTRY_TOKEN }}
          ENV_AZURE_CLIENT_ID: ${{ secrets.COCO_TC_AZURE_CLIENT_ID }}
          ENV_AZURE_TENANT_ID: ${{ secrets.COCO_TC_AZURE_TENANT_ID }}
          ENV_AZURE_REDIRECT_URI: ${{ secrets.COCO_TC_AZURE_REDIRECT_URI }}
          ENV_API_PIN: ${{ secrets.COCO_TC_API_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ secrets.COCO_TC_API_PIN_EXPIRES_AT }}
          ENV_NAME: ${{ github.event.inputs.environment || 'production' }}
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
            echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
            echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
            echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
            echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
            echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
            echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
            echo "EXPO_PUBLIC_AZURE_CLIENT_ID=${ENV_AZURE_CLIENT_ID}"
            echo "EXPO_PUBLIC_AZURE_TENANT_ID=${ENV_AZURE_TENANT_ID}"
            echo "EXPO_PUBLIC_AZURE_REDIRECT_URI=${ENV_AZURE_REDIRECT_URI}"
            echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
            echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
          } > ".env.${ENV_NAME}"

      # ── 6. Install eas-cli ──────────────────────────────────────────────────
      - name: Install eas-cli
        run: npm install -g eas-cli@16.18.1 --silent

      # ── Write Firebase Android config ───────────────────────────────────────
      # GOOGLE_SERVICES_JSON is a file-type EAS env var, but `eas build --local`
      # doesn't reliably resolve file-type env vars (expo/eas-cli#2876, #1253,
      # #3184 — same class of gap as the .env-file workaround above). Decode
      # from a base64 secret (one per environment — each EAS environment has
      # its own Firebase project) and export the path directly so
      # app.config.ts (process.env.GOOGLE_SERVICES_JSON) picks it up
      # regardless.
      - name: Write Firebase Android config
        working-directory: app
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'production' }}
          SECRET_DEVELOPMENT: ${{ secrets.COCO_TC_GOOGLE_SERVICES_JSON_BASE64_DEVELOPMENT }}
          SECRET_PREVIEW: ${{ secrets.COCO_TC_GOOGLE_SERVICES_JSON_BASE64_PREVIEW }}
          SECRET_PRODUCTION: ${{ secrets.COCO_TC_GOOGLE_SERVICES_JSON_BASE64_PRODUCTION }}
        run: |
          case "$ENV_NAME" in
            development) VALUE="$SECRET_DEVELOPMENT" ;;
            preview) VALUE="$SECRET_PREVIEW" ;;
            production) VALUE="$SECRET_PRODUCTION" ;;
            *) echo "ERROR: unknown environment '$ENV_NAME'" >&2; exit 1 ;;
          esac
          if [ -z "$VALUE" ]; then
            echo "ERROR: COCO_TC_GOOGLE_SERVICES_JSON_BASE64_${ENV_NAME^^} secret not set." >&2
            exit 1
          fi
          echo "$VALUE" | base64 -d > google-services.json
          echo "GOOGLE_SERVICES_JSON=$(pwd)/google-services.json" >> "$GITHUB_ENV"

      # ── 7. Build AAB via EAS local build ────────────────────────────────────
      # Signing is handled by EAS itself (eas.json → credentialsSource: remote
      # + --freeze-credentials pulls the registered upload keystore from EAS'
      # own credential store — no keystore secret / credentials.json needed).
      # Replaces the old manual decode-keystore / write-credentials.json /
      # expo-prebuild / JVM-target-patch / Metaspace-bump / gradlew steps.
      - name: Build AAB
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ENV: ${{ github.event.inputs.environment || 'production' }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret not set — add the EAS robot-user access token as a repo secret named EXPO_TOKEN." >&2
            exit 1
          fi

          case "$BUILD_ENV" in
            development) SCRIPT="android:eas:local:dev" ;;
            preview)     SCRIPT="android:eas:local:preview" ;;
            production)  SCRIPT="android:eas:local:prod" ;;
            *) echo "ERROR: unknown environment '$BUILD_ENV'" >&2; exit 1 ;;
          esac

          set -a; source ".env.${BUILD_ENV}"; set +a
          yarn "$SCRIPT" --output app-release.aab

      # ── 8. Get source commit SHA ────────────────────────────────────────────
      - name: Get source commit SHA
        working-directory: app
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # ── 9. Create tag + GitHub Release ──────────────────────────────────────
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.COCO_PAT }}
        run: |
          TAG="tc-build-aab-${{ github.event.inputs.environment || 'production' }}-$(date +%Y%m%d)-${SOURCE_SHA:0:7}"
          NOTES="Branch: ${{ github.event.inputs.branch }}
          Environment: ${{ github.event.inputs.environment || 'production' }}
          Commit: ${SOURCE_SHA}"
          gh release create "$TAG" \
            --repo coco-staging/coco-mobile \
            --title "TC AAB ${{ github.event.inputs.environment || 'production' }} $(date '+%Y-%m-%d')" \
            --notes "$NOTES" \
            app/app-release.aab

      # ── 10. Upload to EAS (best-effort) ─────────────────────────────────────
      # `eas build --local` already registers the build with EAS itself, so
      # this is just a best-effort extra registration. No --fingerprint flag —
      # a separately-computed fingerprint doesn't match what the build itself
      # resolved internally (confirmed on a real run), so passing one would
      # mistag the upload rather than help it. Skipped, not failed, if the
      # account's monthly local-builds quota is exhausted.
      - name: Upload to EAS
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret not set — add the EAS robot-user access token as a repo secret named EXPO_TOKEN." >&2
            exit 1
          fi
          set +e
          OUTPUT=$(eas upload --platform android --build-path "app-release.aab" --non-interactive --json 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "local builds|quota|free plan"; then
              echo "⚠️  Skipping: eas build --local already registered this build with EAS; this extra upload hit the account's local-builds limit for the month, which is expected, not a failure."
              exit 0
            fi
            echo "ERROR: eas upload failed for a reason unrelated to the known quota limit — see output above." >&2
            exit $STATUS
          fi
