name: "[TC] Build Android AAB (Release)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g. develop, main, feat/xyz)'
        required: true
        default: 'develop'
      environment:
        description: 'Build environment'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    name: TC Build AAB (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout coco-mobile source ─────────────────────────────────────
      - name: Checkout coco-mobile
        uses: actions/checkout@v4
        with:
          repository: coco-staging/coco-mobile
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      # ── 2. Setup tools ─────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      # ── 3. Cache Gradle ────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/yarn.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      # ── 4.5. Compute fingerprint (before prebuild, matching EAS's own timing) ─
      # EAS computes a build's fingerprint from source, before prebuild runs —
      # ios/ and android/ don't exist yet at that point. Compute it here at the
      # same point so `eas upload`'s --fingerprint matches what EAS itself
      # would have computed, keeping runtime-version/OTA-update matching correct.
      - name: Compute fingerprint
        working-directory: app
        run: |
          npx --yes @expo/fingerprint@0.16.7 fingerprint:generate --platform android . > /tmp/fingerprint.json
          FINGERPRINT_HASH=$(node -e "console.log(require('/tmp/fingerprint.json').hash)")
          echo "→ Fingerprint: $FINGERPRINT_HASH"
          echo "FINGERPRINT_HASH=$FINGERPRINT_HASH" >> "$GITHUB_ENV"

      # ── 5. Write .env file from secrets ────────────────────────────────────
      - name: Write .env file
        working-directory: app
        env:
          ENV_API_URL: ${{ secrets.COCO_TC_API_URL }}
          ENV_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          ENV_SENTRY_URL: ${{ secrets.COCO_TC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ secrets.COCO_TC_SENTRY_DSN }}
          ENV_SENTRY_PROJECT: ${{ secrets.COCO_TC_SENTRY_PROJECT }}
          ENV_SENTRY_ORG: ${{ secrets.COCO_TC_SENTRY_ORG }}
          ENV_SENTRY_TOKEN: ${{ secrets.COCO_TC_SENTRY_TOKEN }}
          ENV_AZURE_CLIENT_ID: ${{ secrets.COCO_TC_AZURE_CLIENT_ID }}
          ENV_AZURE_TENANT_ID: ${{ secrets.COCO_TC_AZURE_TENANT_ID }}
          ENV_AZURE_REDIRECT_URI: ${{ secrets.COCO_TC_AZURE_REDIRECT_URI }}
          ENV_STORAGE_ENCRYPTION_KEY: ${{ secrets.COCO_TC_STORAGE_ENCRYPTION_KEY }}
          ENV_SOCKET_URL: ${{ secrets.COCO_TC_SOCKET_URL }}
          ENV_API_PIN: ${{ secrets.COCO_TC_API_PIN_SHA256 }}
          ENV_SOCKET_PIN: ${{ secrets.COCO_TC_SOCKET_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ secrets.COCO_TC_API_PIN_EXPIRES_AT }}
          ENV_SOCKET_PIN_EXPIRY: ${{ secrets.COCO_TC_SOCKET_PIN_EXPIRES_AT }}
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
            echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
            echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
            echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
            echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
            echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
            echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
            echo "EXPO_PUBLIC_AZURE_CLIENT_ID=${ENV_AZURE_CLIENT_ID}"
            echo "EXPO_PUBLIC_AZURE_TENANT_ID=${ENV_AZURE_TENANT_ID}"
            echo "EXPO_PUBLIC_AZURE_REDIRECT_URI=${ENV_AZURE_REDIRECT_URI}"
            echo "EXPO_PUBLIC_STORAGE_ENCRYPTION_KEY=${ENV_STORAGE_ENCRYPTION_KEY}"
            echo "EXPO_PUBLIC_SOCKET_URL=${ENV_SOCKET_URL}"
            echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
            echo "EXPO_PUBLIC_SOCKET_PIN_SHA256=${ENV_SOCKET_PIN}"
            echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            echo "EXPO_PUBLIC_SOCKET_PIN_EXPIRES_AT=${ENV_SOCKET_PIN_EXPIRY}"
          } > .env

      # ── 6. Decode keystore ─────────────────────────────────────────────────
      - name: Decode keystore
        working-directory: app
        run: echo "${{ secrets.COCO_TC_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # ── 7. Write credentials.json for custom-signing.gradle ────────────────
      - name: Write credentials.json
        working-directory: app
        env:
          KS_PASSWORD: ${{ secrets.COCO_TC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.COCO_TC_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.COCO_TC_KEY_PASSWORD }}
        run: |
          printf '{"android":{"keystore":{"keystorePath":"release.keystore","keystorePassword":"%s","keyAlias":"%s","keyPassword":"%s"}}}' \
            "${KS_PASSWORD}" "${KS_ALIAS}" "${KS_KEY_PASSWORD}" > credentials.json

      # ── 8. Generate native Android project ──────────────────────────────────
      - name: Run expo prebuild
        working-directory: app
        run: npx expo prebuild --platform android --clean

      # ── 9. Patch JVM target alignment ─────────────────────────────────────
      - name: Patch JVM target alignment
        working-directory: app
        run: |
          cat >> android/build.gradle << 'GRADLEOF'

          gradle.projectsEvaluated {
            subprojects { sub ->
              sub.plugins.withId('com.android.application') {
                sub.android.compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                }
              }
              sub.plugins.withId('com.android.library') {
                sub.android.compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                }
              }
              sub.tasks.configureEach { task ->
                if (task.class.name.contains('KotlinCompile')) {
                  task.kotlinOptions.jvmTarget = '17'
                }
              }
            }
          }
          GRADLEOF

      # ── 10. Bump JVM metaspace ──────────────────────────────────────────────
      - name: Bump JVM metaspace
        working-directory: app
        run: |
          sed -i 's/org\.gradle\.jvmargs=-Xmx[0-9]*m -XX:MaxMetaspaceSize=[0-9]*m/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties

      # ── 11. Build release AAB (all archs for Play Store) ──────────────────
      - name: Build AAB
        working-directory: app/android
        run: ./gradlew bundleRelease --parallel --build-cache -x lint

      # ── 12. Get source commit SHA ──────────────────────────────────────────
      - name: Get source commit SHA
        working-directory: app
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # ── 13. Create tag + GitHub Release ────────────────────────────────────
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.COCO_PAT }}
        run: |
          TAG="tc-build-aab-${{ github.event.inputs.environment || 'production' }}-$(date +%Y%m%d)-${SOURCE_SHA:0:7}"
          NOTES="Branch: ${{ github.event.inputs.branch }}
          Environment: ${{ github.event.inputs.environment || 'production' }}
          Commit: ${SOURCE_SHA}"
          gh release create "$TAG" \
            --repo coco-staging/coco-mobile \
            --title "TC AAB ${{ github.event.inputs.environment || 'production' }} $(date '+%Y-%m-%d')" \
            --notes "$NOTES" \
            app/android/app/build/outputs/bundle/release/*.aab

      # ── 14. Push the build to EAS (Uploaded builds quota) ──────────────────
      # Registers this externally-built AAB with EAS so it shows up in the
      # dashboard / is eligible for `eas submit`, even though it wasn't built
      # by EAS Build itself. Needs an EXPO_TOKEN secret (an EAS robot-user
      # access token — Project settings → Access tokens → Robot users).
      - name: Install eas-cli
        run: npm install -g eas-cli@16.18.1 --silent

      - name: Upload to EAS
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret not set — add the EAS robot-user access token as a repo secret named EXPO_TOKEN." >&2
            exit 1
          fi
          AAB_PATH=$(find android/app/build/outputs/bundle/release -iname '*.aab' | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: no .aab found to upload" >&2
            exit 1
          fi
          eas upload --platform android --build-path "$AAB_PATH" --fingerprint "$FINGERPRINT_HASH" --non-interactive --json
