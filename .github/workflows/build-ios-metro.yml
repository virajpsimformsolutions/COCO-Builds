name: Build iOS Metro (Dev Client)

# Backup path for when the EAS free-tier quota/concurrency is exhausted.
# `target: simulator` needs no signing at all and works with zero extra
# secrets. `target: device` needs IOS_DIST_CERT_BASE64 / IOS_DIST_CERT_PASSWORD
# / IOS_PROVISIONING_PROFILE_BASE64 secrets (same ones the now-removed
# build-ios-ipa.yml used) — the job fails fast with a clear message if
# they're missing.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g. develop, main, feat/xyz)'
        required: true
        default: 'develop'
      environment:
        description: 'Build environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production
      target:
        description: 'Build target'
        required: true
        default: 'simulator'
        type: choice
        options:
          - simulator
          - device

jobs:
  build-ios:
    name: Build iOS Metro (${{ github.event.inputs.target || 'simulator' }}, ${{ github.event.inputs.environment || 'development' }})
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      # ── 1. Checkout COCO-Builds (workflow repo) ────────────────────────────
      - name: Checkout COCO-Builds
        uses: actions/checkout@v4
        with:
          repository: virajpsimformsolutions/COCO-Builds
          token: ${{ secrets.COCO_PAT }}

      # ── 2. Checkout coco-patient-mobile source ─────────────────────────────
      - name: Checkout coco-patient-mobile
        uses: actions/checkout@v4
        with:
          repository: coco-staging/Coco-patient-mobile
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      # ── 3. Setup tools ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # ── 3.5. Pin Xcode version ──────────────────────────────────────────────
      # macos-15 defaults to Xcode 16.4, but pin explicitly in case GitHub
      # changes the image default. Newer Xcode (26.x, what "macos-latest"
      # resolves to as of writing) enables Explicit Modules by default, which
      # breaks RCT_EXPORT_MODULE/RCT_EXPORT_METHOD macro visibility in
      # react-native-firebase's RNFB modules — same failure the (now removed)
      # build-ios-ipa.yml hit and fixed by pinning macos-15 + Xcode 16.4.
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || \
          { echo "Xcode 16.4 not found. Available versions:"; ls /Applications/Xcode*.app 2>/dev/null || echo "No Xcode*.app found"; echo "Current: $(xcode-select -p)"; exit 1; }
          xcodebuild -version

      # ── 4. Cache CocoaPods ──────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ── 5. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      # ── 6. Write .env file from secrets ─────────────────────────────────────
      - name: Write .env file
        working-directory: app
        env:
          ENV_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          ENV_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          ENV_SENTRY_URL: ${{ secrets.EXPO_PUBLIC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ secrets.EXPO_SENTRY_URL }}
          ENV_SENTRY_PROJECT: ${{ secrets.EXPO_SENTRY_PROJECT_NAME }}
          ENV_SENTRY_ORG: ${{ secrets.EXPO_SENTRY_ORGANIZATION }}
          ENV_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ENV_API_KEY: ${{ secrets.EXPO_PUBLIC_API_ENCRYPTION_KEY }}
          ENV_SOCKET_URL: ${{ secrets.EXPO_PUBLIC_SOCKET_URL }}
          ENV_API_PIN: ${{ secrets.EXPO_PUBLIC_API_PIN_SHA256 }}
          ENV_SOCKET_PIN: ${{ secrets.EXPO_PUBLIC_SOCKET_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ secrets.EXPO_PUBLIC_API_PIN_EXPIRES_AT }}
          ENV_SOCKET_PIN_EXPIRY: ${{ secrets.EXPO_PUBLIC_SOCKET_PIN_EXPIRES_AT }}
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
            echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
            echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
            echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
            echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
            echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
            echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
            echo "EXPO_PUBLIC_API_ENCRYPTION_KEY=${ENV_API_KEY}"
            echo "EXPO_PUBLIC_SOCKET_URL=${ENV_SOCKET_URL}"
            echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
            echo "EXPO_PUBLIC_SOCKET_PIN_SHA256=${ENV_SOCKET_PIN}"
            echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            echo "EXPO_PUBLIC_SOCKET_PIN_EXPIRES_AT=${ENV_SOCKET_PIN_EXPIRY}"
          } > .env

      # ── 7a. Device target — import cert + provisioning profile first ───────
      # (must happen before prebuild/pod install so nothing else in the job
      # can fail silently past the point where signing was actually possible)
      - name: Import Apple Distribution Certificate
        if: ${{ github.event.inputs.target == 'device' }}
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "ERROR: IOS_DIST_CERT_BASE64 / IOS_DIST_CERT_PASSWORD secrets are not set." >&2
            echo "Add them (see COCO-BUILD-DOCUMENTATION.md) before running a device build, or use target: simulator." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="coco-build-$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm /tmp/dist.p12

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Install Provisioning Profile
        if: ${{ github.event.inputs.target == 'device' }}
        env:
          PROV_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$PROV_BASE64" ]; then
            echo "ERROR: IOS_PROVISIONING_PROFILE_BASE64 secret is not set." >&2
            echo "Add it (see COCO-BUILD-DOCUMENTATION.md) before running a device build, or use target: simulator." >&2
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/app.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i /tmp/app.mobileprovision)")
          cp /tmp/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "→ Installed profile UUID: $UUID"
          echo "APP_PROFILE_UUID=$UUID" >> $GITHUB_ENV

      # ── 8. Generate native iOS project ──────────────────────────────────────
      - name: Run expo prebuild
        working-directory: app
        run: npx expo prebuild --platform ios --clean

      # ── 9. Install CocoaPods ────────────────────────────────────────────────
      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install

      # ── 10. Resolve scheme ───────────────────────────────────────────────────
      - name: Resolve scheme
        working-directory: app
        id: scheme
        run: |
          SCHEME=$(xcodebuild -list -project ios/*.xcodeproj 2>/dev/null | grep -A1 "Schemes:" | tail -1 | xargs || \
                  xcodebuild -list -workspace ios/*.xcworkspace 2>/dev/null | grep -A1 "Schemes:" | tail -1 | xargs)
          if [ -z "$SCHEME" ]; then
            echo "ERROR: could not resolve an Xcode scheme" >&2
            exit 1
          fi
          echo "SCHEME=$SCHEME" >> $GITHUB_OUTPUT
          echo "Resolved scheme: $SCHEME"

      # ── 11.5. Resolve bundle ID (device export only) ────────────────────────
      - name: Resolve bundle ID
        if: ${{ github.event.inputs.target == 'device' }}
        working-directory: app
        id: bundle
        run: |
          ENV="${{ github.event.inputs.environment || 'development' }}"
          case "$ENV" in
            preview)
              APP_BUNDLE="com.cocointel.smile.preview"
              ;;
            production)
              APP_BUNDLE="com.cocointel.smile"
              ;;
            development|*)
              APP_BUNDLE="com.cocointel.smile.dev"
              ;;
          esac
          echo "APP_BUNDLE=$APP_BUNDLE" >> $GITHUB_OUTPUT
          echo "App bundle: $APP_BUNDLE"

      # ── 11a. Simulator build — no signing required ──────────────────────────
      - name: Build for Simulator
        if: ${{ github.event.inputs.target != 'device' }}
        working-directory: app/ios
        run: |
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme '${{ steps.scheme.outputs.SCHEME }}' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

          APP_PATH=$(find build/Build/Products -maxdepth 1 -iname '*-iphonesimulator' -type d | head -1)
          APP_PATH=$(find "$APP_PATH" -maxdepth 1 -iname '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: could not find built .app under build/Build/Products" >&2
            exit 1
          fi
          echo "→ Built app: $APP_PATH"
          mkdir -p ../dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "../dist/CocoSmileDev-simulator.zip"
          # ../dist is relative to app/ios, i.e. app/dist — later steps run
          # with working-directory: app, so record the path relative to that.
          echo "ARTIFACT_PATH=dist/CocoSmileDev-simulator.zip" >> "$GITHUB_ENV"
          echo "ARTIFACT_LABEL=Simulator .app (zip)" >> "$GITHUB_ENV"

      # ── 11b. Device build — manual signing, development export ─────────────
      - name: Archive for device
        if: ${{ github.event.inputs.target == 'device' }}
        working-directory: app/ios
        run: |
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme '${{ steps.scheme.outputs.SCHEME }}' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/coco.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=Z8778PLB65 \
            PROVISIONING_PROFILE_SPECIFIER="${APP_PROFILE_UUID}" \
            ONLY_ACTIVE_ARCH=NO

      - name: Export IPA
        if: ${{ github.event.inputs.target == 'device' }}
        run: |
          cat > /tmp/export.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>Z8778PLB65</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ steps.bundle.outputs.APP_BUNDLE }}</key>
              <string>${APP_PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/coco.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist /tmp/export.plist

          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -iname '*.ipa' | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: exportArchive did not produce an .ipa" >&2
            exit 1
          fi
          mkdir -p ../dist
          cp "$IPA_PATH" ../dist/CocoSmileDev-device.ipa
          echo "ARTIFACT_PATH=dist/CocoSmileDev-device.ipa" >> "$GITHUB_ENV"
          echo "ARTIFACT_LABEL=Device .ipa (development signed)" >> "$GITHUB_ENV"

      # ── 12. Get source commit SHA ────────────────────────────────────────────
      - name: Get source commit SHA
        working-directory: app
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ── 13. Create tag + GitHub Release ──────────────────────────────────────
      - name: Create Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.COCO_PAT }}
        run: |
          TAG="build-ios-metro-${{ github.event.inputs.target || 'simulator' }}-${{ github.event.inputs.environment || 'development' }}-$(date +%Y%m%d)-${SOURCE_SHA:0:7}"
          NOTES="Branch: ${{ github.event.inputs.branch }}
          Environment: ${{ github.event.inputs.environment || 'development' }}
          Target: ${{ github.event.inputs.target || 'simulator' }}
          Artifact: ${ARTIFACT_LABEL}
          Commit: ${SOURCE_SHA}"
          gh release create "$TAG" \
            --repo coco-staging/Coco-patient-mobile \
            --title "iOS Metro (${{ github.event.inputs.target || 'simulator' }}) ${{ github.event.inputs.environment || 'development' }} $(date '+%Y-%m-%d')" \
            --notes "$NOTES" \
            "$ARTIFACT_PATH"
