name: Build iOS Metro (Dev Client) [merged]

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        default: "patient-mobile"
        type: choice
        options:
          - patient-mobile
          - tc
      branch:
        description: "Branch to build (e.g. develop, main, feat/xyz)"
        required: true
        default: "develop"
      environment:
        description: "Build environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - preview
          - production
      target:
        description: "Build target"
        required: true
        default: "simulator"
        type: choice
        options:
          - simulator
          - device
      runner:
        description: "Runner environment"
        required: true
        default: "github-hosted"
        type: choice
        options:
          - self-hosted
          - github-hosted
      xcode:
        description: "Preferred Xcode version (patient-mobile only, must be >= 26.0 for Expo SDK 55)"
        required: true
        default: "26.6"
      enable_rnrepo:
        description: "Use RNRepo prebuilt native artifacts"
        required: true
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS Metro (${{ github.event.inputs.app }}, ${{ github.event.inputs.target || 'simulator' }}, ${{ github.event.inputs.environment || 'development' }})
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJSON('["self-hosted","macOS"]') || fromJSON('["macos-latest"]') }}
    timeout-minutes: 90

    steps:
      - name: Checkout mobile app source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.app == 'tc' && 'coco-staging/coco-mobile' || 'coco-staging/Coco-patient-mobile' }}
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "yarn"
          cache-dependency-path: app/yarn.lock

      - name: Cache RNRepo iOS artifacts
        uses: actions/cache@v4
        with:
          path: ~/.rnrepo-cache
          key: rnrepo-ios-${{ runner.os }}-${{ hashFiles('app/yarn.lock', 'app/rnrepo.config.json') }}
          restore-keys: |
            rnrepo-ios-${{ runner.os }}-

      # patient-mobile only — TC currently builds against whatever Xcode is
      # already selected on the runner (no version gate on that side today).
      - name: Select Xcode >= 26
        if: ${{ github.event.inputs.app != 'tc' }}
        env:
          REQUESTED_XCODE: ${{ github.event.inputs.xcode || '26.6' }}
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          requested = ENV.fetch("REQUESTED_XCODE")
          min_major = 26

          candidates = Dir.glob("/Applications/Xcode*.app").select { |p| File.directory?(p) }

          parsed = candidates.filter_map do |app|
            xb = File.join(app, "Contents/Developer/usr/bin/xcodebuild")
            next unless File.executable?(xb)

            version_line = `"#{xb}" -version 2>/dev/null`.lines.find { |l| l.start_with?("Xcode ") }
            next unless version_line

            version = version_line.split[1]
            major = version.split(".").first.to_i
            [app, version, major]
          end

          if parsed.empty?
            abort("ERROR: no usable Xcode installations found under /Applications")
          end

          requested_match = parsed.find { |_app, version, _major| version == requested }

          selected = if requested_match
            requested_match
          else
            parsed
              .select { |_app, _version, major| major >= min_major }
              .max_by { |_app, version, _major| version.split('.').map(&:to_i) }
          end

          unless selected
            installed = parsed.map { |_app, version, _major| version }.uniq.sort.join(", ")
            abort("ERROR: Expo SDK 55 requires Xcode >= #{min_major}.0. Requested #{requested}. Installed: [#{installed}]. Use self-hosted runner with Xcode 26+.")
          end

          app, version, major = selected
          if major < min_major
            abort("ERROR: selected Xcode #{version} is below required #{min_major}.0")
          end

          File.open(ENV.fetch("GITHUB_ENV"), "a") do |f|
            f.puts("SELECTED_XCODE_APP=#{app}")
            f.puts("SELECTED_XCODE_VERSION=#{version}")
          end

          puts("Selected Xcode #{version} at #{app}")
          RUBY

          SELECTED_XCODE_APP="${SELECTED_XCODE_APP:-}"
          if [ -z "$SELECTED_XCODE_APP" ]; then
            SELECTED_XCODE_APP="$(grep '^SELECTED_XCODE_APP=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)"
          fi

          if [ -z "$SELECTED_XCODE_APP" ]; then
            echo "ERROR: failed to resolve SELECTED_XCODE_APP after Xcode selection" >&2
            exit 1
          fi

          if ! sudo xcode-select -s "$SELECTED_XCODE_APP/Contents/Developer"; then
            xcode-select -s "$SELECTED_XCODE_APP/Contents/Developer"
          fi

          echo "Active Xcode:"
          xcodebuild -version

      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      - name: Compute fingerprint
        working-directory: app
        run: |
          npx --yes @expo/fingerprint@0.16.7 fingerprint:generate --platform ios . > /tmp/fingerprint.json
          FINGERPRINT_HASH=$(node -e "console.log(require('/tmp/fingerprint.json').hash)")
          echo "→ Fingerprint: $FINGERPRINT_HASH"
          echo "FINGERPRINT_HASH=$FINGERPRINT_HASH" >> "$GITHUB_ENV"

      # .env content is branched per-app (not just per-secret) — TC ships
      # Azure SSO + storage-encryption vars that patient-mobile doesn't use,
      # and patient-mobile ships an API-encryption key TC doesn't use. Each
      # branch below reproduces that app's original .env output exactly.
      - name: Write .env file
        working-directory: app
        env:
          APP_SELECTOR: ${{ github.event.inputs.app }}
          ENV_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          ENV_API_URL: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
          ENV_SENTRY_URL: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_URL || secrets.EXPO_PUBLIC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_DSN || secrets.EXPO_SENTRY_URL }}
          ENV_SENTRY_PROJECT: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_PROJECT || secrets.EXPO_SENTRY_PROJECT_NAME }}
          ENV_SENTRY_ORG: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_ORG || secrets.EXPO_SENTRY_ORGANIZATION }}
          ENV_SENTRY_TOKEN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          ENV_API_PIN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_PIN_SHA256 || secrets.EXPO_PUBLIC_API_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_PIN_EXPIRES_AT || secrets.EXPO_PUBLIC_API_PIN_EXPIRES_AT }}
          ENV_AZURE_CLIENT_ID: ${{ secrets.COCO_TC_AZURE_CLIENT_ID }}
          ENV_AZURE_TENANT_ID: ${{ secrets.COCO_TC_AZURE_TENANT_ID }}
          ENV_AZURE_REDIRECT_URI: ${{ secrets.COCO_TC_AZURE_REDIRECT_URI }}
        run: |
          if [ "$APP_SELECTOR" = "tc" ]; then
            {
              echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
              echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
              echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
              echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
              echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
              echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
              echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
              echo "EXPO_PUBLIC_AZURE_CLIENT_ID=${ENV_AZURE_CLIENT_ID}"
              echo "EXPO_PUBLIC_AZURE_TENANT_ID=${ENV_AZURE_TENANT_ID}"
              echo "EXPO_PUBLIC_AZURE_REDIRECT_URI=${ENV_AZURE_REDIRECT_URI}"
              echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
              echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            } > .env
          else
            {
              echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
              echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
              echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
              echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
              echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
              echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
              echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
              echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
              echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            } > .env
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli@16.18.1 --silent

      - name: Resolve EAS profile
        id: eas_profile
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'simulator' }}"
          ENV_NAME="${{ github.event.inputs.environment || 'development' }}"

          case "$ENV_NAME" in
            development)
              NODE_ENV_VALUE="development"
              ;;
            preview)
              NODE_ENV_VALUE="preview"
              ;;
            production|*)
              NODE_ENV_VALUE="production"
              ;;
          esac

          if [ "$TARGET" = "simulator" ]; then
            PROFILE="metro-dev"
            EXT="tar.gz"
            LABEL="Simulator dev-client artifact"
          else
            case "$ENV_NAME" in
              development)
                PROFILE="development"
                ;;
              preview)
                PROFILE="preview"
                ;;
              production|*)
                PROFILE="production"
                ;;
            esac
            EXT="ipa"
            LABEL="Device iOS artifact"
          fi

          echo "PROFILE=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "NODE_ENV=$NODE_ENV_VALUE" >> "$GITHUB_OUTPUT"
          echo "EXT=$EXT" >> "$GITHUB_OUTPUT"
          echo "LABEL=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Using EAS profile: $PROFILE"
          echo "Using NODE_ENV: $NODE_ENV_VALUE"

      # patient-mobile only — TC's eas.json profiles aren't patched for
      # runtime parity today.
      - name: Align EAS profile env for runtime parity
        if: ${{ github.event.inputs.app != 'tc' }}
        working-directory: app
        env:
          PROFILE: ${{ steps.eas_profile.outputs.PROFILE }}
          NODE_ENV_VALUE: ${{ steps.eas_profile.outputs.NODE_ENV }}
          EXPO_ENV_VALUE: ${{ github.event.inputs.environment || 'development' }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SENTRY_URL: ${{ secrets.EXPO_PUBLIC_SENTRY_URL }}
          EXPO_SENTRY_URL: ${{ secrets.EXPO_SENTRY_URL }}
          EXPO_SENTRY_PROJECT_NAME: ${{ secrets.EXPO_SENTRY_PROJECT_NAME }}
          EXPO_SENTRY_ORGANIZATION: ${{ secrets.EXPO_SENTRY_ORGANIZATION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_API_PIN_SHA256: ${{ secrets.EXPO_PUBLIC_API_PIN_SHA256 }}
          EXPO_PUBLIC_API_PIN_EXPIRES_AT: ${{ secrets.EXPO_PUBLIC_API_PIN_EXPIRES_AT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const easJsonPath = 'eas.json';
          const profile = process.env.PROFILE;
          const nodeEnv = process.env.NODE_ENV_VALUE;
          const expoEnv = process.env.EXPO_ENV_VALUE;

          if (!profile || !nodeEnv || !expoEnv) {
            throw new Error('Missing PROFILE/NODE_ENV_VALUE/EXPO_ENV_VALUE');
          }

          const eas = JSON.parse(fs.readFileSync(easJsonPath, 'utf8'));
          eas.build = eas.build || {};

          if (!eas.build[profile]) {
            throw new Error(`Profile "${profile}" not found in eas.json`);
          }

          const selected = eas.build[profile];
          selected.env = {
            ...(selected.env || {}),
            NODE_ENV: nodeEnv,
            EXPO_PUBLIC_ENVIRONMENT: expoEnv,
            EXPO_PUBLIC_API_URL: process.env.EXPO_PUBLIC_API_URL || '',
            EXPO_PUBLIC_SENTRY_URL: process.env.EXPO_PUBLIC_SENTRY_URL || '',
            EXPO_SENTRY_URL: process.env.EXPO_SENTRY_URL || '',
            EXPO_SENTRY_PROJECT_NAME: process.env.EXPO_SENTRY_PROJECT_NAME || '',
            EXPO_SENTRY_ORGANIZATION: process.env.EXPO_SENTRY_ORGANIZATION || '',
            SENTRY_AUTH_TOKEN: process.env.SENTRY_AUTH_TOKEN || '',
            EXPO_PUBLIC_API_PIN_SHA256: process.env.EXPO_PUBLIC_API_PIN_SHA256 || '',
            EXPO_PUBLIC_API_PIN_EXPIRES_AT: process.env.EXPO_PUBLIC_API_PIN_EXPIRES_AT || '',
          };
          selected.environment = expoEnv;
          eas.build[profile] = selected;

          fs.writeFileSync(easJsonPath, `${JSON.stringify(eas, null, 2)}\n`);
          console.log(`Patched eas.json profile ${profile}: NODE_ENV=${nodeEnv}, environment=${expoEnv}`);
          NODE

      # patient-mobile only — TC does not use a fingerprint/runtime-version
      # override today.
      - name: Resolve runtime version override
        if: ${{ github.event.inputs.app != 'tc' }}
        id: runtime_version
        working-directory: app
        env:
          NODE_ENV: ${{ steps.eas_profile.outputs.NODE_ENV }}
          EXPO_PUBLIC_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          EXPO_NO_DOTENV: 1
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SENTRY_URL: ${{ secrets.EXPO_PUBLIC_SENTRY_URL }}
          EXPO_SENTRY_URL: ${{ secrets.EXPO_SENTRY_URL }}
          EXPO_SENTRY_PROJECT_NAME: ${{ secrets.EXPO_SENTRY_PROJECT_NAME }}
          EXPO_SENTRY_ORGANIZATION: ${{ secrets.EXPO_SENTRY_ORGANIZATION }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_API_PIN_SHA256: ${{ secrets.EXPO_PUBLIC_API_PIN_SHA256 }}
          EXPO_PUBLIC_API_PIN_EXPIRES_AT: ${{ secrets.EXPO_PUBLIC_API_PIN_EXPIRES_AT }}
        run: |
          set -euo pipefail

          RUNTIME_VERSION="$(npx expo-updates runtimeversion:resolve --platform ios | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const out=JSON.parse(s);if(!out.runtimeVersion){process.exit(2);}process.stdout.write(out.runtimeVersion);});')"

          if [ -z "${RUNTIME_VERSION:-}" ]; then
            echo "ERROR: failed to resolve runtimeVersion" >&2
            exit 1
          fi

          echo "VALUE=$RUNTIME_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved runtimeVersion override=$RUNTIME_VERSION"

      - name: Build iOS Metro with EAS local
        working-directory: app
        env:
          APP_SELECTOR: ${{ github.event.inputs.app }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1
          EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
          EXPO_NO_DOTENV: ${{ github.event.inputs.app != 'tc' && '1' || '' }}
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ github.event.inputs.app != 'tc' && steps.runtime_version.outputs.VALUE || '' }}
          DISABLE_RNREPO: ${{ github.event.inputs.enable_rnrepo == 'true' && '0' || '1' }}
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "ERROR: EXPO_TOKEN secret is required for EAS local build." >&2
            exit 1
          fi

          if [ "$APP_SELECTOR" != "tc" ] && [ -z "${EXPO_UPDATES_FINGERPRINT_OVERRIDE:-}" ]; then
            echo "ERROR: EXPO_UPDATES_FINGERPRINT_OVERRIDE is empty" >&2
            exit 1
          fi

          mkdir -p "${{ runner.temp }}/dist"
          if [ "$APP_SELECTOR" = "tc" ]; then
            ARTIFACT_PREFIX="coco-tc-ios-metro"
          else
            ARTIFACT_PREFIX="coco-patient-ios-metro"
          fi
          ARTIFACT_PATH="${{ runner.temp }}/dist/${ARTIFACT_PREFIX}-${{ steps.eas_profile.outputs.PROFILE }}.${{ steps.eas_profile.outputs.EXT }}"

          eas build \
            --platform ios \
            --profile "${{ steps.eas_profile.outputs.PROFILE }}" \
            --local \
            --non-interactive \
            --output "$ARTIFACT_PATH"

          if [ ! -f "$ARTIFACT_PATH" ]; then
            echo "ERROR: EAS local build finished without producing artifact at $ARTIFACT_PATH" >&2
            exit 1
          fi

          echo "ARTIFACT_PATH=$ARTIFACT_PATH" >> "$GITHUB_ENV"
          echo "ARTIFACT_LABEL=${{ steps.eas_profile.outputs.LABEL }}" >> "$GITHUB_ENV"
          echo "Built artifact: $ARTIFACT_PATH"

      - name: Get source commit SHA
        working-directory: app
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.COCO_PAT }}
          APP_SELECTOR: ${{ github.event.inputs.app }}
        run: |
          if [ "$APP_SELECTOR" = "tc" ]; then
            REPO="coco-staging/coco-mobile"
            TAG_PREFIX="tc-build-ios-metro"
            TITLE_PREFIX="TC iOS Metro"
          else
            REPO="coco-staging/Coco-patient-mobile"
            TAG_PREFIX="build-ios-metro"
            TITLE_PREFIX="iOS Metro"
          fi

          TAG="${TAG_PREFIX}-${{ github.event.inputs.target || 'simulator' }}-${{ github.event.inputs.environment || 'development' }}-$(date +%Y%m%d)-${SOURCE_SHA:0:7}"
          NOTES="Branch: ${{ github.event.inputs.branch }}
          Environment: ${{ github.event.inputs.environment || 'development' }}
          Target: ${{ github.event.inputs.target || 'simulator' }}
          Build flow: EAS local
          EAS profile: ${{ steps.eas_profile.outputs.PROFILE }}
          Artifact: ${ARTIFACT_LABEL}
          Commit: ${SOURCE_SHA}"

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "${TITLE_PREFIX} (${{ github.event.inputs.target || 'simulator' }}) ${{ github.event.inputs.environment || 'development' }} $(date '+%Y-%m-%d')" \
            --notes "$NOTES" \
            "${ARTIFACT_PATH}"

      - name: Upload to EAS
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret not set — add the EAS robot-user access token as a repo secret named EXPO_TOKEN." >&2
            exit 1
          fi
          eas upload --platform ios --build-path "$ARTIFACT_PATH" --fingerprint "$FINGERPRINT_HASH" --non-interactive --json
