name: Build iOS Metro (Dev Client) [merged]

# metro-dev / metro-dev-ios-device are fixed profiles (channel + EAS
# environment always "development" — see eas.json) — there is no
# per-environment variant for dev-client builds, so this workflow has no
# "environment" input.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        default: "patient-mobile"
        type: choice
        options:
          - patient-mobile
          - tc
      branch:
        description: "Branch to build (e.g. develop, main, feat/xyz)"
        required: true
        default: "develop"
      target:
        description: "Build target"
        required: true
        default: "simulator"
        type: choice
        options:
          - simulator
          - device
      runner:
        description: "Runner environment"
        required: true
        default: "github-hosted"
        type: choice
        options:
          - self-hosted
          - github-hosted
      xcode:
        description: "Preferred Xcode version (must be >= 26.0 for Expo SDK 55)"
        required: true
        default: "26.6"
      enable_rnrepo:
        description: "Use RNRepo prebuilt native artifacts"
        required: true
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS Metro (${{ github.event.inputs.app }}, ${{ github.event.inputs.target || 'simulator' }})
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJSON('["self-hosted","macOS"]') || fromJSON('["macos-latest"]') }}
    timeout-minutes: 90

    steps:
      # ── 1. Checkout mobile app source ───────────────────────────────────────
      - name: Checkout mobile app source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.app == 'tc' && 'coco-staging/coco-mobile' || 'coco-staging/Coco-patient-mobile' }}
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "yarn"
          cache-dependency-path: app/yarn.lock

      - name: Cache RNRepo iOS artifacts
        uses: actions/cache@v4
        with:
          path: ~/.rnrepo-cache
          key: rnrepo-ios-${{ runner.os }}-${{ hashFiles('app/yarn.lock', 'app/rnrepo.config.json') }}
          restore-keys: |
            rnrepo-ios-${{ runner.os }}-

      # ── Select Xcode >= 26 ───────────────────────────────────────────────────
      - name: Select Xcode >= 26
        env:
          REQUESTED_XCODE: ${{ github.event.inputs.xcode || '26.6' }}
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          requested = ENV.fetch("REQUESTED_XCODE")
          min_major = 26

          candidates = Dir.glob("/Applications/Xcode*.app").select { |p| File.directory?(p) }

          parsed = candidates.filter_map do |app|
            xb = File.join(app, "Contents/Developer/usr/bin/xcodebuild")
            next unless File.executable?(xb)

            version_line = `"#{xb}" -version 2>/dev/null`.lines.find { |l| l.start_with?("Xcode ") }
            next unless version_line

            version = version_line.split[1]
            major = version.split(".").first.to_i
            [app, version, major]
          end

          if parsed.empty?
            abort("ERROR: no usable Xcode installations found under /Applications")
          end

          requested_match = parsed.find { |_app, version, _major| version == requested }

          selected = if requested_match
            requested_match
          else
            parsed
              .select { |_app, _version, major| major >= min_major }
              .max_by { |_app, version, _major| version.split('.').map(&:to_i) }
          end

          unless selected
            installed = parsed.map { |_app, version, _major| version }.uniq.sort.join(", ")
            abort("ERROR: Expo SDK 55 requires Xcode >= #{min_major}.0. Requested #{requested}. Installed: [#{installed}]. Use self-hosted runner with Xcode 26+.")
          end

          app, version, major = selected
          if major < min_major
            abort("ERROR: selected Xcode #{version} is below required #{min_major}.0")
          end

          File.open(ENV.fetch("GITHUB_ENV"), "a") do |f|
            f.puts("SELECTED_XCODE_APP=#{app}")
            f.puts("SELECTED_XCODE_VERSION=#{version}")
          end

          puts("Selected Xcode #{version} at #{app}")
          RUBY

          SELECTED_XCODE_APP="${SELECTED_XCODE_APP:-}"
          if [ -z "$SELECTED_XCODE_APP" ]; then
            SELECTED_XCODE_APP="$(grep '^SELECTED_XCODE_APP=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)"
          fi

          if [ -z "$SELECTED_XCODE_APP" ]; then
            echo "ERROR: failed to resolve SELECTED_XCODE_APP after Xcode selection" >&2
            exit 1
          fi

          if ! sudo xcode-select -s "$SELECTED_XCODE_APP/Contents/Developer"; then
            xcode-select -s "$SELECTED_XCODE_APP/Contents/Developer"
          fi

          echo "Active Xcode:"
          xcodebuild -version

      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      # ── Write .env.development file from secrets ────────────────────────────
      # metro-dev / metro-dev-ios-device are always the "development" EAS
      # environment/channel. Neither metro yarn script sources a .env file
      # automatically, so we source it ourselves in the build step below.
      - name: Write .env file
        working-directory: app
        env:
          APP_SELECTOR: ${{ github.event.inputs.app }}
          ENV_API_URL: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
          ENV_SENTRY_URL: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_URL || secrets.EXPO_PUBLIC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_DSN || secrets.EXPO_SENTRY_URL }}
          ENV_SENTRY_PROJECT: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_PROJECT || secrets.EXPO_SENTRY_PROJECT_NAME }}
          ENV_SENTRY_ORG: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_ORG || secrets.EXPO_SENTRY_ORGANIZATION }}
          ENV_SENTRY_TOKEN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          ENV_API_PIN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_PIN_SHA256 || secrets.EXPO_PUBLIC_API_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_PIN_EXPIRES_AT || secrets.EXPO_PUBLIC_API_PIN_EXPIRES_AT }}
          ENV_AZURE_CLIENT_ID: ${{ secrets.COCO_TC_AZURE_CLIENT_ID }}
          ENV_AZURE_TENANT_ID: ${{ secrets.COCO_TC_AZURE_TENANT_ID }}
          ENV_AZURE_REDIRECT_URI: ${{ secrets.COCO_TC_AZURE_REDIRECT_URI }}
        run: |
          if [ "$APP_SELECTOR" = "tc" ]; then
            {
              echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
              echo "EXPO_PUBLIC_ENVIRONMENT=development"
              echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
              echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
              echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
              echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
              echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
              echo "EXPO_PUBLIC_AZURE_CLIENT_ID=${ENV_AZURE_CLIENT_ID}"
              echo "EXPO_PUBLIC_AZURE_TENANT_ID=${ENV_AZURE_TENANT_ID}"
              echo "EXPO_PUBLIC_AZURE_REDIRECT_URI=${ENV_AZURE_REDIRECT_URI}"
              echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
              echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            } > .env.development
          else
            {
              echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
              echo "EXPO_PUBLIC_ENVIRONMENT=development"
              echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
              echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
              echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
              echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
              echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
              echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
              echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            } > .env.development
          fi

      - name: Install eas-cli
        run: npm install -g eas-cli@16.18.1 --silent

      # ── Write Firebase iOS config (tc only) ─────────────────────────────────
      # GOOGLE_SERVICE_INFO_PLIST is a file-type EAS env var, but `eas build
      # --local` doesn't reliably resolve file-type env vars (expo/eas-cli
      # #2876, #1253, #3184). Decode from a base64 secret and export the path
      # directly so app.config.ts (process.env.GOOGLE_SERVICE_INFO_PLIST)
      # picks it up regardless. patient-mobile has its own Firebase handling,
      # untouched.
      - name: Write Firebase iOS config
        if: ${{ github.event.inputs.app == 'tc' }}
        working-directory: app
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.COCO_TC_GOOGLE_SERVICE_INFO_PLIST_BASE64_DEVELOPMENT }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "ERROR: COCO_TC_GOOGLE_SERVICE_INFO_PLIST_BASE64_DEVELOPMENT secret not set." >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > GoogleService-Info.plist
          echo "GOOGLE_SERVICE_INFO_PLIST=$(pwd)/GoogleService-Info.plist" >> "$GITHUB_ENV"

      # ── Build iOS Metro via EAS local build ─────────────────────────────────
      # target=simulator → profile metro-dev (.tar.gz simulator dev-client).
      # target=device     → profile metro-dev-ios-device (.ipa ad-hoc
      # dev-client build — signing via credentialsSource: remote, same as the
      # AAB pipeline). Replaces the old manual profile-resolution /
      # eas.json-patching / runtime-version-override steps — eas build --local
      # resolves the fingerprint/runtime version internally on its own
      # (confirmed on the AAB pipeline's real runs).
      - name: Build iOS Metro
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DISABLE_RNREPO: ${{ github.event.inputs.enable_rnrepo == 'true' && '0' || '1' }}
          TARGET: ${{ github.event.inputs.target || 'simulator' }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret not set — add the EAS robot-user access token as a repo secret named EXPO_TOKEN." >&2
            exit 1
          fi

          case "$TARGET" in
            simulator) SCRIPT="ios:eas:local:metro:simulator"; EXT="tar.gz"; LABEL="Simulator dev-client artifact" ;;
            device)    SCRIPT="ios:eas:local:metro:device";    EXT="ipa";    LABEL="Device dev-client artifact" ;;
            *) echo "ERROR: unknown target '$TARGET'" >&2; exit 1 ;;
          esac

          set -a; source ".env.development"; set +a
          yarn "$SCRIPT" --output "app-metro.$EXT"

          echo "ARTIFACT_PATH=app/app-metro.$EXT" >> "$GITHUB_ENV"
          echo "ARTIFACT_LABEL=$LABEL" >> "$GITHUB_ENV"

      - name: Get source commit SHA
        working-directory: app
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.COCO_PAT }}
          APP_SELECTOR: ${{ github.event.inputs.app }}
        run: |
          if [ "$APP_SELECTOR" = "tc" ]; then
            REPO="coco-staging/coco-mobile"
            TAG_PREFIX="tc-build-ios-metro"
            TITLE_PREFIX="TC iOS Metro"
          else
            REPO="coco-staging/Coco-patient-mobile"
            TAG_PREFIX="build-ios-metro"
            TITLE_PREFIX="iOS Metro"
          fi

          TAG="${TAG_PREFIX}-${{ github.event.inputs.target || 'simulator' }}-development-$(date +%Y%m%d)-${SOURCE_SHA:0:7}"
          NOTES="Branch: ${{ github.event.inputs.branch }}
          Environment: development
          Target: ${{ github.event.inputs.target || 'simulator' }}
          Build flow: EAS local
          Artifact: ${ARTIFACT_LABEL}
          Commit: ${SOURCE_SHA}"

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "${TITLE_PREFIX} (${{ github.event.inputs.target || 'simulator' }}) development $(date '+%Y-%m-%d')" \
            --notes "$NOTES" \
            "${ARTIFACT_PATH}"

      # ── Upload to EAS (best-effort) ──────────────────────────────────────────
      # `eas build --local` already registers the build with EAS itself, so
      # this is just a best-effort extra registration. Skipped, not failed, if
      # the account's monthly local-builds quota is exhausted.
      - name: Upload to EAS
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret not set — add the EAS robot-user access token as a repo secret named EXPO_TOKEN." >&2
            exit 1
          fi
          set +e
          OUTPUT=$(eas upload --platform ios --build-path "${ARTIFACT_PATH#app/}" --non-interactive --json 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "local builds|quota|free plan"; then
              echo "⚠️  Skipping: eas build --local already registered this build with EAS; this extra upload hit the account's local-builds limit for the month, which is expected, not a failure."
              exit 0
            fi
            echo "ERROR: eas upload failed for a reason unrelated to the known quota limit — see output above." >&2
            exit $STATUS
          fi
