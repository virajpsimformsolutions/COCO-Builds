name: Build Android APK (Release)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g. develop, main, feat/xyz)'
        required: true
        default: 'develop'
      environment:
        description: 'Build environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    name: Build APK (${{ github.event.inputs.environment || 'development' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout coco-patient-mobile source ─────────────────────────────
      - name: Checkout coco-patient-mobile
        uses: actions/checkout@v4
        with:
          repository: coco-staging/Coco-patient-mobile
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      # ── 2. Setup tools ─────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      # ── 3. Cache Gradle ────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/yarn.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      # ── 5. Write .env file from secrets ────────────────────────────────────
      - name: Write .env file
        working-directory: app
        env:
          ENV_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          ENV_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          ENV_SENTRY_URL: ${{ secrets.EXPO_PUBLIC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ secrets.EXPO_SENTRY_URL }}
          ENV_SENTRY_PROJECT: ${{ secrets.EXPO_SENTRY_PROJECT_NAME }}
          ENV_SENTRY_ORG: ${{ secrets.EXPO_SENTRY_ORGANIZATION }}
          ENV_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ENV_API_PIN: ${{ secrets.EXPO_PUBLIC_API_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ secrets.EXPO_PUBLIC_API_PIN_EXPIRES_AT }}
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
            echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
            echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
            echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
            echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
            echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
            echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
            echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
            echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
          } > .env

      # ── 6. Decode keystore ─────────────────────────────────────────────────
      - name: Decode keystore
        working-directory: app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # ── 7. Write credentials.json for custom-signing.gradle ────────────────
      - name: Write credentials.json
        working-directory: app
        env:
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '{"android":{"keystore":{"keystorePath":"release.keystore","keystorePassword":"%s","keyAlias":"%s","keyPassword":"%s"}}}' \
            "${KS_PASSWORD}" "${KS_ALIAS}" "${KS_KEY_PASSWORD}" > credentials.json

      # ── 8. Generate native Android project ──────────────────────────────────
      # Expo config plugins (including react-native-docusign's Maven repo) run here.
      - name: Run expo prebuild
        working-directory: app
        run: npx expo prebuild --platform android --clean

      # ── 9. Fix DocuSign AAR dependency (compileOnly in module, implementation in app) ──
      # Gradle 9's bundleReleaseAar forbids local .aar deps in library projects.
      # We change implementation files(...) to compileOnly files(...) in the module
      # (compileOnly is not packaged so bundleReleaseAar passes), then add the
      # stripped AAR as implementation files(...) in the app build (APK builds are fine).
      - name: Fix DocuSign AAR dependency
        working-directory: app
        run: |
          DS_LIBS="node_modules/react-native-docusign/android/libs"
          DS_GRADLE="node_modules/react-native-docusign/android/build.gradle"

          echo "=== libs/ contents ==="
          ls -la "$DS_LIBS" 2>/dev/null || echo "(empty)"

          # 1. Change implementation files(...) to compileOnly files(...) in module
          echo "=== Before: implementation files line ==="
          grep -n "files.*sdk-pdf" "$DS_GRADLE" || echo "(not found)"

          sed -i 's/implementation files/compileOnly files/' "$DS_GRADLE"

          echo "=== After: should be compileOnly ==="
          grep -n "files.*sdk-pdf" "$DS_GRADLE" || echo "(not found)"

          # 2. Remove flatDir from root build.gradle (added by Expo plugin, not needed)
          ROOT_BUILD_GRADLE="android/build.gradle"
          if grep -q "flatDir.*libs" "$ROOT_BUILD_GRADLE" 2>/dev/null; then
            echo "=== Removing flatDir from root build.gradle ==="
            sed -i '/flatDir.*libs/d' "$ROOT_BUILD_GRADLE"
          fi

      # ── 10. Patch JVM target alignment ─────────────────────────────────────
      # Align all Android subprojects to Java 17 (stable for RN builds).
      - name: Patch JVM target alignment
        working-directory: app
        run: |
          cat >> android/build.gradle << 'GRADLEOF'

          gradle.projectsEvaluated {
            subprojects { sub ->
              sub.plugins.withId('com.android.application') {
                sub.android.compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                }
              }
              sub.plugins.withId('com.android.library') {
                sub.android.compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                }
              }
              sub.tasks.configureEach { task ->
                if (task.class.name.contains('KotlinCompile')) {
                  task.kotlinOptions.jvmTarget = '17'
                }
              }
            }
          }
          GRADLEOF

      # ── 11. Add stripped DocuSign AAR to app build (for runtime) ────────────
      # The module uses compileOnly for the stripped AAR (not packaged in AAR).
      # The app needs it at runtime, so we add implementation files(...) here.
      - name: Add stripped DocuSign AAR to app build
        working-directory: app
        run: |
          DS_AAR_PATH="../../node_modules/react-native-docusign/android/libs/sdk-pdf-2.1.4-stripped.aar"
          echo '' >> android/app/build.gradle
          echo '// Stripped sdk-pdf AAR (Glide class removed, avoids dex collision with expo-image)' >> android/app/build.gradle
          echo "project.dependencies.add('implementation', files('$DS_AAR_PATH'))" >> android/app/build.gradle
          echo "=== Stripped AAR dependency added to app/build.gradle ==="

      # ── 12. Bump JVM metaspace (avoid OOM from class metadata) ────────────
      - name: Bump JVM metaspace
        working-directory: app
        run: |
          sed -i 's/org\.gradle\.jvmargs=-Xmx[0-9]*m -XX:MaxMetaspaceSize=[0-9]*m/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          grep "org.gradle.jvmargs" android/gradle.properties

      # ── 13. Build release APK (arm64 only for speed) ──────────────────────
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --parallel --build-cache -PreactNativeArchitectures=arm64-v8a -x lint

      # ── 14. Get source commit SHA ──────────────────────────────────────────
      - name: Get source commit SHA
        working-directory: app
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # ── 15. Create tag + GitHub Release ────────────────────────────────────
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.COCO_PAT }}
        run: |
          TAG="build-apk-${{ github.event.inputs.environment || 'development' }}-$(date +%Y%m%d)-${SOURCE_SHA:0:7}"
          NOTES="Branch: ${{ github.event.inputs.branch }}
          Environment: ${{ github.event.inputs.environment || 'development' }}
          Commit: ${SOURCE_SHA}"
          gh release create "$TAG" \
            --repo coco-staging/Coco-patient-mobile \
            --title "APK ${{ github.event.inputs.environment || 'development' }} $(date '+%Y-%m-%d')" \
            --notes "$NOTES" \
            app/android/app/build/outputs/apk/release/*.apk
