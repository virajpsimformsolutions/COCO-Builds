name: Build Android APK (Release)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g. develop, main, feat/xyz)'
        required: true
        default: 'develop'
      environment:
        description: 'Build environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    name: Build APK (${{ github.event.inputs.environment || 'development' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout COCO-Builds (workflow repo) ────────────────────────────
      - name: Checkout COCO-Builds
        uses: actions/checkout@v4
        with:
          repository: virajpsimformsolutions/COCO-Builds
          token: ${{ secrets.COCO_PAT }}

      # ── 2. Checkout coco-patient-mobile source ─────────────────────────────
      - name: Checkout coco-patient-mobile
        uses: actions/checkout@v4
        with:
          repository: coco-staging/Coco-patient-mobile
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      # ── 3. Setup tools ─────────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      # ── 4. Cache Gradle ────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/yarn.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 5. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      # ── 6. Write .env file from secrets ────────────────────────────────────
      - name: Write .env file
        working-directory: app
        env:
          ENV_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          ENV_ENVIRONMENT: ${{ github.event.inputs.environment || 'development' }}
          ENV_SENTRY_URL: ${{ secrets.EXPO_PUBLIC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ secrets.EXPO_SENTRY_URL }}
          ENV_SENTRY_PROJECT: ${{ secrets.EXPO_SENTRY_PROJECT_NAME }}
          ENV_SENTRY_ORG: ${{ secrets.EXPO_SENTRY_ORGANIZATION }}
          ENV_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ENV_API_KEY: ${{ secrets.EXPO_PUBLIC_API_ENCRYPTION_KEY }}
          ENV_SOCKET_URL: ${{ secrets.EXPO_PUBLIC_SOCKET_URL }}
          ENV_API_PIN: ${{ secrets.EXPO_PUBLIC_API_PIN_SHA256 }}
          ENV_SOCKET_PIN: ${{ secrets.EXPO_PUBLIC_SOCKET_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ secrets.EXPO_PUBLIC_API_PIN_EXPIRES_AT }}
          ENV_SOCKET_PIN_EXPIRY: ${{ secrets.EXPO_PUBLIC_SOCKET_PIN_EXPIRES_AT }}
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
            echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
            echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
            echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
            echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
            echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
            echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
            echo "EXPO_PUBLIC_API_ENCRYPTION_KEY=${ENV_API_KEY}"
            echo "EXPO_PUBLIC_SOCKET_URL=${ENV_SOCKET_URL}"
            echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
            echo "EXPO_PUBLIC_SOCKET_PIN_SHA256=${ENV_SOCKET_PIN}"
            echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            echo "EXPO_PUBLIC_SOCKET_PIN_EXPIRES_AT=${ENV_SOCKET_PIN_EXPIRY}"
          } > .env

      # ── 7. Decode keystore ─────────────────────────────────────────────────
      - name: Decode keystore
        working-directory: app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # ── 8. Write credentials.json for custom-signing.gradle ────────────────
      - name: Write credentials.json
        working-directory: app
        env:
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '{"android":{"keystore":{"keystorePath":"release.keystore","keystorePassword":"%s","keyAlias":"%s","keyPassword":"%s"}}}' \
            "${KS_PASSWORD}" "${KS_ALIAS}" "${KS_KEY_PASSWORD}" > credentials.json

      # ── 9. Strip DocuSign AAR ──────────────────────────────────────────────
      - name: Strip DocuSign AAR
        working-directory: app
        run: bash scripts/strip-docusign-aar.sh

      # ── 10. Generate native Android project ────────────────────────────────
      - name: Run expo prebuild
        working-directory: app
        run: npx expo prebuild --platform android --clean

      # ── 11. Disable Kotlin JVM target validation ──────────────────────────
      # react-native-docusign compiles Kotlin with JVM 21 but Java defaults to 17.
      # Instead of patching build.gradle (which breaks with Gradle 9's afterEvaluate),
      # we tell Kotlin to warn instead of failing on mismatched JVM targets.
      - name: Disable Kotlin JVM target validation
        working-directory: app
        run: echo 'kotlin.jvm.target.validation.mode=warning' >> android/gradle.properties

      # ── 12. Build release APK (arm64 only for speed) ──────────────────────
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --parallel --build-cache -PreactNativeArchitectures=arm64-v8a -x lint

      # ── 13. Upload APK artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coco-patient-${{ github.event.inputs.environment || 'development' }}-apk-${{ github.sha }}
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
