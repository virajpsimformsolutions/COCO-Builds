name: Build Android AAB (Release) [merged]

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        default: "patient-mobile"
        type: choice
        options:
          - patient-mobile
          - tc
      branch:
        description: 'Branch to build (e.g. develop, main, feat/xyz)'
        required: true
        default: 'develop'
      environment:
        description: 'Build environment'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    name: Build AAB (${{ github.event.inputs.app }}, ${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout mobile app source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.app == 'tc' && 'coco-staging/coco-mobile' || 'coco-staging/Coco-patient-mobile' }}
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/yarn.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      # EAS computes a build's fingerprint from source, before prebuild runs —
      # ios/ and android/ don't exist yet at that point. Compute it here at the
      # same point so `eas upload`'s --fingerprint matches what EAS itself
      # would have computed, keeping runtime-version/OTA-update matching correct.
      - name: Compute fingerprint
        working-directory: app
        run: |
          npx --yes @expo/fingerprint@0.16.7 fingerprint:generate --platform android . > /tmp/fingerprint.json
          FINGERPRINT_HASH=$(node -e "console.log(require('/tmp/fingerprint.json').hash)")
          echo "→ Fingerprint: $FINGERPRINT_HASH"
          echo "FINGERPRINT_HASH=$FINGERPRINT_HASH" >> "$GITHUB_ENV"

      # .env content is branched per-app — TC ships Azure SSO + storage-
      # encryption vars that patient-mobile doesn't use, and patient-mobile
      # ships an API-encryption key TC doesn't use. Each branch below
      # reproduces that app's original .env output exactly.
      - name: Write .env file
        working-directory: app
        env:
          APP_SELECTOR: ${{ github.event.inputs.app }}
          ENV_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          ENV_API_URL: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
          ENV_SENTRY_URL: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_URL || secrets.EXPO_PUBLIC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_DSN || secrets.EXPO_SENTRY_URL }}
          ENV_SENTRY_PROJECT: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_PROJECT || secrets.EXPO_SENTRY_PROJECT_NAME }}
          ENV_SENTRY_ORG: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_ORG || secrets.EXPO_SENTRY_ORGANIZATION }}
          ENV_SENTRY_TOKEN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_SENTRY_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          ENV_API_PIN: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_PIN_SHA256 || secrets.EXPO_PUBLIC_API_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_API_PIN_EXPIRES_AT || secrets.EXPO_PUBLIC_API_PIN_EXPIRES_AT }}
          ENV_AZURE_CLIENT_ID: ${{ secrets.COCO_TC_AZURE_CLIENT_ID }}
          ENV_AZURE_TENANT_ID: ${{ secrets.COCO_TC_AZURE_TENANT_ID }}
          ENV_AZURE_REDIRECT_URI: ${{ secrets.COCO_TC_AZURE_REDIRECT_URI }}
        run: |
          if [ "$APP_SELECTOR" = "tc" ]; then
            {
              echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
              echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
              echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
              echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
              echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
              echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
              echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
              echo "EXPO_PUBLIC_AZURE_CLIENT_ID=${ENV_AZURE_CLIENT_ID}"
              echo "EXPO_PUBLIC_AZURE_TENANT_ID=${ENV_AZURE_TENANT_ID}"
              echo "EXPO_PUBLIC_AZURE_REDIRECT_URI=${ENV_AZURE_REDIRECT_URI}"
              echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
              echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            } > .env
          else
            {
              echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
              echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
              echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
              echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
              echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
              echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
              echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
              echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
              echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
            } > .env
          fi

      # patient-mobile only — keystore/signing secrets differ per app.
      - name: Decode keystore
        working-directory: app
        run: |
          if [ "${{ github.event.inputs.app }}" = "tc" ]; then
            echo "${{ secrets.COCO_TC_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi

      - name: Write credentials.json for custom-signing.gradle
        working-directory: app
        env:
          KS_PASSWORD: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_KEY_ALIAS || secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ github.event.inputs.app == 'tc' && secrets.COCO_TC_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          printf '{"android":{"keystore":{"keystorePath":"release.keystore","keystorePassword":"%s","keyAlias":"%s","keyPassword":"%s"}}}' \
            "${KS_PASSWORD}" "${KS_ALIAS}" "${KS_KEY_PASSWORD}" > credentials.json

      - name: Run expo prebuild
        working-directory: app
        run: npx expo prebuild --platform android --clean

      # patient-mobile only — TC doesn't depend on react-native-docusign.
      - name: Fix DocuSign AAR dependency
        if: ${{ github.event.inputs.app != 'tc' }}
        working-directory: app
        run: |
          DS_GRADLE="node_modules/react-native-docusign/android/build.gradle"
          sed -i 's/implementation files/compileOnly files/' "$DS_GRADLE"
          ROOT_BUILD_GRADLE="android/build.gradle"
          if grep -q "flatDir.*libs" "$ROOT_BUILD_GRADLE" 2>/dev/null; then
            sed -i '/flatDir.*libs/d' "$ROOT_BUILD_GRADLE"
          fi

      - name: Patch JVM target alignment
        working-directory: app
        run: |
          cat >> android/build.gradle << 'GRADLEOF'

          gradle.projectsEvaluated {
            subprojects { sub ->
              sub.plugins.withId('com.android.application') {
                sub.android.compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                }
              }
              sub.plugins.withId('com.android.library') {
                sub.android.compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                }
              }
              sub.tasks.configureEach { task ->
                if (task.class.name.contains('KotlinCompile')) {
                  task.kotlinOptions.jvmTarget = '17'
                }
              }
            }
          }
          GRADLEOF

      # patient-mobile only — pairs with "Fix DocuSign AAR dependency" above.
      - name: Add stripped DocuSign AAR to app build
        if: ${{ github.event.inputs.app != 'tc' }}
        working-directory: app
        run: |
          DS_AAR_PATH="../../node_modules/react-native-docusign/android/libs/sdk-pdf-2.1.4-stripped.aar"
          echo '' >> android/app/build.gradle
          echo "project.dependencies.add('implementation', files('$DS_AAR_PATH'))" >> android/app/build.gradle

      - name: Bump JVM metaspace
        working-directory: app
        run: |
          sed -i 's/org\.gradle\.jvmargs=-Xmx[0-9]*m -XX:MaxMetaspaceSize=[0-9]*m/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties

      - name: Build AAB
        working-directory: app/android
        run: ./gradlew bundleRelease --parallel --build-cache -x lint

      - name: Get source commit SHA
        working-directory: app
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.COCO_PAT }}
          APP_SELECTOR: ${{ github.event.inputs.app }}
        run: |
          if [ "$APP_SELECTOR" = "tc" ]; then
            REPO="coco-staging/coco-mobile"
            TAG_PREFIX="tc-build-aab"
            TITLE_PREFIX="TC AAB"
          else
            REPO="coco-staging/Coco-patient-mobile"
            TAG_PREFIX="build-aab"
            TITLE_PREFIX="AAB"
          fi

          TAG="${TAG_PREFIX}-${{ github.event.inputs.environment || 'production' }}-$(date +%Y%m%d)-${SOURCE_SHA:0:7}"
          NOTES="Branch: ${{ github.event.inputs.branch }}
          Environment: ${{ github.event.inputs.environment || 'production' }}
          Commit: ${SOURCE_SHA}"

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "${TITLE_PREFIX} ${{ github.event.inputs.environment || 'production' }} $(date '+%Y-%m-%d')" \
            --notes "$NOTES" \
            app/android/app/build/outputs/bundle/release/*.aab

      # Registers this externally-built AAB with EAS so it shows up in the
      # dashboard / is eligible for `eas submit`, even though it wasn't built
      # by EAS Build itself. Needs an EXPO_TOKEN secret (an EAS robot-user
      # access token — Project settings → Access tokens → Robot users).
      - name: Install eas-cli
        run: npm install -g eas-cli@16.18.1 --silent

      - name: Upload to EAS
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret not set — add the EAS robot-user access token as a repo secret named EXPO_TOKEN." >&2
            exit 1
          fi
          AAB_PATH=$(find android/app/build/outputs/bundle/release -iname '*.aab' | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: no .aab found to upload" >&2
            exit 1
          fi
          eas upload --platform android --build-path "$AAB_PATH" --fingerprint "$FINGERPRINT_HASH" --non-interactive --json
