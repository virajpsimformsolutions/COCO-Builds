name: "[TC] Build iOS IPA (Release)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (e.g. develop, main, feat/xyz)"
        required: true
        default: "develop"
      environment:
        description: "Build environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - preview
          - production
      runner:
        description: "Runner environment"
        required: true
        default: "github-hosted"
        type: choice
        options:
          - self-hosted
          - github-hosted
      enable_rnrepo:
        description: "Use RNRepo prebuilt native artifacts"
        required: true
        default: true
        type: boolean

jobs:
  build-ios:
    name: TC Build IPA (${{ github.event.inputs.environment || 'production' }})
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJSON('["self-hosted","macOS"]') || fromJSON('["macos-latest"]') }}
    timeout-minutes: 90

    steps:
      # ── 1. Checkout coco-mobile source ──────────────────────────────────────
      - name: Checkout coco-mobile
        uses: actions/checkout@v4
        with:
          repository: coco-staging/coco-mobile
          ref: ${{ github.event.inputs.branch }}
          path: app
          token: ${{ secrets.COCO_PAT }}

      # ── 2. Setup tools ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "yarn"
          cache-dependency-path: app/yarn.lock

      - name: Cache RNRepo iOS artifacts
        uses: actions/cache@v4
        with:
          path: ~/.rnrepo-cache
          key: rnrepo-ios-${{ runner.os }}-${{ hashFiles('app/yarn.lock', 'app/rnrepo.config.json') }}
          restore-keys: |
            rnrepo-ios-${{ runner.os }}-

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile

      # ── 4. Write .env file from secrets ────────────────────────────────────
      - name: Write .env file
        working-directory: app
        env:
          ENV_API_URL: ${{ secrets.COCO_TC_API_URL }}
          ENV_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          ENV_SENTRY_URL: ${{ secrets.COCO_TC_SENTRY_URL }}
          ENV_SENTRY_DSN: ${{ secrets.COCO_TC_SENTRY_DSN }}
          ENV_SENTRY_PROJECT: ${{ secrets.COCO_TC_SENTRY_PROJECT }}
          ENV_SENTRY_ORG: ${{ secrets.COCO_TC_SENTRY_ORG }}
          ENV_SENTRY_TOKEN: ${{ secrets.COCO_TC_SENTRY_TOKEN }}
          ENV_AZURE_CLIENT_ID: ${{ secrets.COCO_TC_AZURE_CLIENT_ID }}
          ENV_AZURE_TENANT_ID: ${{ secrets.COCO_TC_AZURE_TENANT_ID }}
          ENV_AZURE_REDIRECT_URI: ${{ secrets.COCO_TC_AZURE_REDIRECT_URI }}
          ENV_API_PIN: ${{ secrets.COCO_TC_API_PIN_SHA256 }}
          ENV_API_PIN_EXPIRY: ${{ secrets.COCO_TC_API_PIN_EXPIRES_AT }}
        run: |
          {
            echo "EXPO_PUBLIC_API_URL=${ENV_API_URL}"
            echo "EXPO_PUBLIC_ENVIRONMENT=${ENV_ENVIRONMENT}"
            echo "EXPO_PUBLIC_SENTRY_URL=${ENV_SENTRY_URL}"
            echo "EXPO_SENTRY_URL=${ENV_SENTRY_DSN}"
            echo "EXPO_SENTRY_PROJECT_NAME=${ENV_SENTRY_PROJECT}"
            echo "EXPO_SENTRY_ORGANIZATION=${ENV_SENTRY_ORG}"
            echo "SENTRY_AUTH_TOKEN=${ENV_SENTRY_TOKEN}"
            echo "EXPO_PUBLIC_AZURE_CLIENT_ID=${ENV_AZURE_CLIENT_ID}"
            echo "EXPO_PUBLIC_AZURE_TENANT_ID=${ENV_AZURE_TENANT_ID}"
            echo "EXPO_PUBLIC_AZURE_REDIRECT_URI=${ENV_AZURE_REDIRECT_URI}"
            echo "EXPO_PUBLIC_API_PIN_SHA256=${ENV_API_PIN}"
            echo "EXPO_PUBLIC_API_PIN_EXPIRES_AT=${ENV_API_PIN_EXPIRY}"
          } > .env

      # ── 5. Install EAS CLI ─────────────────────────────────────────────────
      - name: Install EAS CLI
        run: npm install -g eas-cli@16.18.1 --silent

      # ── 6. Map workflow environment to EAS profile ────────────────────────
      - name: Resolve EAS profile
        id: eas_profile
        run: |
          set -euo pipefail
          ENV_NAME="${{ github.event.inputs.environment || 'production' }}"
          case "$ENV_NAME" in
            development)
              PROFILE="development"
              ;;
            preview)
              PROFILE="preview"
              ;;
            production|*)
              PROFILE="production"
              ;;
          esac
          echo "PROFILE=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Using EAS profile: $PROFILE"

      # ── Write Firebase iOS config ───────────────────────────────────────────
      # Prefer environment-scoped GOOGLE_SERVICE_INFO_PLIST (new setup). Keep
      # legacy COCO_TC_*_BASE64_* fallback so older environments still work.
      - name: Write Firebase iOS config
        working-directory: app
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'production' }}
          GOOGLE_SERVICE_INFO_PLIST_PRIMARY: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          SECRET_DEVELOPMENT: ${{ secrets.COCO_TC_GOOGLE_SERVICE_INFO_PLIST_BASE64_DEVELOPMENT }}
          SECRET_PREVIEW: ${{ secrets.COCO_TC_GOOGLE_SERVICE_INFO_PLIST_BASE64_PREVIEW }}
          SECRET_PRODUCTION: ${{ secrets.COCO_TC_GOOGLE_SERVICE_INFO_PLIST_BASE64_PRODUCTION }}
        run: |
          VALUE="$GOOGLE_SERVICE_INFO_PLIST_PRIMARY"
          if [ -z "$VALUE" ]; then
            case "$ENV_NAME" in
              development) VALUE="$SECRET_DEVELOPMENT" ;;
              preview) VALUE="$SECRET_PREVIEW" ;;
              production) VALUE="$SECRET_PRODUCTION" ;;
              *) echo "ERROR: unknown environment '$ENV_NAME'" >&2; exit 1 ;;
            esac
          fi
          if [ -z "$VALUE" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST (or legacy COCO_TC_*_BASE64 secret) not set for '$ENV_NAME'." >&2
            exit 1
          fi
          if [ -f "$VALUE" ]; then
            cp "$VALUE" GoogleService-Info.plist
          elif echo "$VALUE" | base64 -d > GoogleService-Info.plist 2>/dev/null; then
            :
          else
            printf '%s' "$VALUE" > GoogleService-Info.plist
          fi
          echo "GOOGLE_SERVICE_INFO_PLIST=$(pwd)/GoogleService-Info.plist" >> "$GITHUB_ENV"

      # ── 7. Generate iOS project for local build ────────────────────────────
      - name: Run expo prebuild (iOS)
        working-directory: app
        run: npx expo prebuild --platform ios --clean --non-interactive

      # ── 8. Cache CocoaPods (keyed on Podfile.lock, generated by prebuild) ──
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: |
          set -euo pipefail
          pod install

      # ── 9. Build iOS IPA via local runner (no EAS cloud build) ────────────
      # NOTE: DerivedData is intentionally left in place between runs on
      # self-hosted runners — wiping it here forced a fully clean native
      # compile every build and was the largest avoidable cost in this job.
      - name: Build iOS IPA with EAS local
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1
          EAS_BUILD_DISABLE_EXPO_DOCTOR_STEP: 1
          DISABLE_RNREPO: ${{ github.event.inputs.enable_rnrepo == 'true' && '0' || '1' }}
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "ERROR: EXPO_TOKEN secret is required for EAS local build." >&2
            exit 1
          fi

          mkdir -p "${{ runner.temp }}/ipa"
          IPA_PATH="${{ runner.temp }}/ipa/coco-tc-${{ steps.eas_profile.outputs.PROFILE }}.ipa"

          echo "xcode-select path: $(xcode-select -p)"
          xcodebuild -version

          eas build \
            --platform ios \
            --profile "${{ steps.eas_profile.outputs.PROFILE }}" \
            --local \
            --non-interactive \
            --output "$IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: EAS local build finished without producing IPA at $IPA_PATH" >&2
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Built IPA: $IPA_PATH"

      # ── 10. Get source commit SHA ───────────────────────────────────────────
      - name: Get source commit SHA
        working-directory: app
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # ── 11. Create tag + GitHub Release ─────────────────────────────────────
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.COCO_PAT }}
        run: |
          TAG="tc-build-ipa-${{ github.event.inputs.environment || 'production' }}-$(date +%Y%m%d)-${SOURCE_SHA:0:7}"
          NOTES="Branch: ${{ github.event.inputs.branch }}
          Environment: ${{ github.event.inputs.environment || 'production' }}
          Build flow: EAS local
          EAS profile: ${{ steps.eas_profile.outputs.PROFILE }}
          Commit: ${SOURCE_SHA}"
          gh release create "$TAG" \
            --repo coco-staging/coco-mobile \
            --title "TC IPA ${{ github.event.inputs.environment || 'production' }} $(date '+%Y-%m-%d')" \
            --notes "$NOTES" \
            "${IPA_PATH}"
